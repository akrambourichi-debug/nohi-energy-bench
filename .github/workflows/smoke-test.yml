name: smoke test

on:
  push:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the bench image
        run: docker build -t nohi_energy_bench .
      - name: Run a reduced scenario
        run: >
          docker run --rm nohi_energy_bench sh -c
          "python3 bench_energy.py train &&
          python3 bench_energy.py batch-ml --n 200000 &&
          python3 bench_energy.py batch-nohi --n 200000 &&
          python3 bench_energy.py single-ml --n 2000 &&
          python3 bench_energy.py single-nohi --n 2000"
