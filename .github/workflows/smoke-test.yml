name: smoke test

on:
  push:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the bench image
        run: docker build -t nohi_energy_bench .
      - name: Run a reduced scenario
        run: |
          docker run -d --name nohibench nohi_energy_bench
          docker exec nohibench python3 bench_energy.py train
          docker exec nohibench python3 bench_energy.py load
          docker exec nohibench python3 bench_energy.py batch-ml --n 200000
          docker exec nohibench python3 bench_energy.py batch-nohi --n 200000
          docker exec nohibench python3 bench_energy.py single-ml --n 2000
          docker exec nohibench python3 bench_energy.py single-nohi --n 2000
          python3 make_scenario_backends.py /tmp/scenario_check.yml && diff /tmp/scenario_check.yml usage_scenario_backends.yml
          for b in LightGBM DecisionTree MLP; do
            docker exec nohibench python3 bench_energy.py train --backend $b
            docker exec nohibench python3 bench_energy.py load --backend $b
            docker exec nohibench python3 bench_energy.py batch-ml --n 200000 --backend $b
            docker exec nohibench python3 bench_energy.py batch-nohi --n 200000 --backend $b
            docker exec nohibench python3 bench_energy.py single-ml --n 2000 --backend $b
            docker exec nohibench python3 bench_energy.py single-nohi --n 2000 --backend $b
          done
          docker rm -f nohibench
