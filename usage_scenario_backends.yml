---
name: NOHI energy bench, four classifiers (CIC-IDS2017 sample, with and without the ontology rule layer)
author: Akram Bourichi
description: Energy of training and of inference, vectorised and flow by flow, for each classifier alone and for the full NOHI path (classifier, rules, fusion, decision trace). Same phases as usage_scenario.yml, repeated for XGBoost, LightGBM, a decision tree and an MLP; the two cheap classifiers process more flows per pass so that a pass lasts tens of seconds.

services:
  nohibench:
    build:
      context: .
    image: nohi_energy_bench

flow:
  - name: Idle reference (30 s)
    container: nohibench
    commands:
      - type: console
        command: sleep 30
        note: container idle
  - name: XGBoost - Train classifier and fit rules
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py train --backend XGBoost
        note: training on the sample
  - name: XGBoost - Start-up only x5 (libraries and model load)
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py load --backend XGBoost
        note: start-up 1 of 5
      - type: console
        command: python3 bench_energy.py load --backend XGBoost
        note: start-up 2 of 5
      - type: console
        command: python3 bench_energy.py load --backend XGBoost
        note: start-up 3 of 5
      - type: console
        command: python3 bench_energy.py load --backend XGBoost
        note: start-up 4 of 5
      - type: console
        command: python3 bench_energy.py load --backend XGBoost
        note: start-up 5 of 5
  - name: XGBoost - Batch - classifier only - pass 1 (3000000 flows)
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py batch-ml --n 3000000 --backend XGBoost
        note: vectorised classifier
  - name: XGBoost - Batch - full NOHI - pass 1 (3000000 flows)
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py batch-nohi --n 3000000 --backend XGBoost
        note: vectorised classifier, rules and fusion
  - name: XGBoost - Batch - full NOHI - pass 2 (3000000 flows)
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py batch-nohi --n 3000000 --backend XGBoost
        note: vectorised classifier, rules and fusion
  - name: XGBoost - Batch - classifier only - pass 2 (3000000 flows)
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py batch-ml --n 3000000 --backend XGBoost
        note: vectorised classifier
  - name: XGBoost - Single flow - classifier only - pass 1 (30000 flows)
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py single-ml --n 30000 --backend XGBoost
        note: one flow at a time and one thread
  - name: XGBoost - Single flow - full NOHI with trace - pass 1 (30000 flows)
    container: nohibench
    commands:
      - type: console
        command: python3 bench_energy.py single-nohi --n 30000 --backend XGBoost
        note: one flow at a time and one thread with explanation
  - name: XGBoost - Single flow - full NOHI with trace - pass 2 (30000 flows)
    container: nohibench
